[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/typeshelf/typeshelf"

[workspace.dependencies]
ts-model = { path = "crates/ts-model" }
ts-store = { path = "crates/ts-store" }
ts-index = { path = "crates/ts-index" }
ts-activate = { path = "crates/ts-activate" }
ts-search = { path = "crates/ts-search" }

anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
memmap2 = "0.9"
notify = "8.2"
rayon = "1.12"
read-fonts = "0.46"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
skrifa = "0.49"
tempfile = "3"
walkdir = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
